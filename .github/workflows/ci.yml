name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Lint, checks and unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile sources
        run: python -m py_compile bing_daily_wallpaper.py bing_core.py bing_service.py platform_windows.py installer.py platform_linux.py bing_qt_app.py generate_version_info.py check_version_sync.py smoke_check.py

      - name: Version metadata in sync
        run: python check_version_sync.py

      - name: Packaging smoke checks
        run: python smoke_check.py

      - name: Unit tests
        run: python -m pytest -q

  test-linux:
    name: Linux checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt pytest==9.2.0 pyflakes
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libxkbcommon0 libdbus-1-3 > /dev/null

      - name: Lint
        run: python -m pyflakes bing_core.py bing_service.py platform_linux.py bing_qt_app.py

      - name: Unit tests (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  flatpak:
    name: Build Flatpak bundle
    needs: test-linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build and bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: BingWallpaper.flatpak
          manifest-path: flatpak/io.github.silviudobrica.BingWallpaper.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Checksum
        shell: bash
        run: sha256sum BingWallpaper.flatpak > BingWallpaper.flatpak.sha256

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: BingWallpaper-flatpak
          path: |
            BingWallpaper.flatpak
            BingWallpaper.flatpak.sha256
          if-no-files-found: error

  build:
    name: Build installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build BingWallpaper.exe and InstallBingWallpaper.exe
        shell: pwsh
        run: .\build_installer.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: InstallBingWallpaper
          path: |
            dist/InstallBingWallpaper.exe
            dist/InstallBingWallpaper.exe.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    # Only for version tags, e.g. v1.4.4. Pushing the tag is the one manual step:
    #   git tag v1.4.4 && git push origin v1.4.4
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches _version.py
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -nE 's/^__version__ *= *["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' _version.py)
          echo "tag=$tag version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match __version__ = $version in _version.py"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          notes="RELEASE_NOTES_${version}.md"
          if [ -f "$notes" ]; then
            echo "NOTES_PATH=$notes" >> "$GITHUB_ENV"
          else
            echo "::warning::$notes not found; GitHub will generate the release notes"
            echo "NOTES_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Download the installer built by the build job
        uses: actions/download-artifact@v4
        with:
          name: InstallBingWallpaper
          path: dist

      - name: Download the Flatpak bundle built by the flatpak job
        uses: actions/download-artifact@v4
        with:
          name: BingWallpaper-flatpak
          path: dist

      - name: Create release and attach installer
        uses: softprops/action-gh-release@v2
        with:
          name: Bing Daily Wallpaper v${{ env.VERSION }}
          body_path: ${{ env.NOTES_PATH }}
          generate_release_notes: ${{ env.NOTES_PATH == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/InstallBingWallpaper.exe
            dist/InstallBingWallpaper.exe.sha256
            dist/BingWallpaper.flatpak
            dist/BingWallpaper.flatpak.sha256
          fail_on_unmatched_files: true
