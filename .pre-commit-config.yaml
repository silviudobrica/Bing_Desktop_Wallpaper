repos:
  - repo: local
    hooks:
      - id: version-metadata-sync
        name: Ensure version metadata is synced
        entry: python check_version_sync.py
        language: system
        pass_filenames: false
      - id: python-syntax-check
        name: Compile core Python files
        entry: python -m py_compile bing_daily_wallpaper.py bing_core.py bing_service.py platform_windows.py installer.py platform_linux.py bing_qt_app.py generate_version_info.py check_version_sync.py smoke_check.py
        language: system
        pass_filenames: false
      - id: smoke-check
        name: Run packaging smoke checks
        entry: python smoke_check.py
        language: system
        pass_filenames: false
      - id: unit-tests
        name: Run unit tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
